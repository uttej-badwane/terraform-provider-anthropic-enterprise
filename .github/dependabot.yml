# Dependency updates. There are two Go modules: the provider at the root and
# the documentation tooling under tools/, which Dependabot treats separately.
#
# Minor and patch bumps are grouped into a single pull request per ecosystem to
# keep review load low; majors arrive on their own because they need thought.
#
# The commit prefixes differ on purpose, because the prefix decides whether a
# merge cuts a release. Only the root Go module ends up inside the binary users
# download, so only it uses `deps`, which releases a patch. The tools module,
# the actions and the npm release tooling all build or publish the provider
# without being part of it, so they use `ci`, which releases nothing. Bumping
# an action is not a reason to put another version of the provider on a
# registry that cannot withdraw one.
#
# This matters more now that patch and minor updates merge themselves; see
# .github/workflows/dependabot-auto-merge.yml.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - tooling
    commit-message:
      prefix: "ci(tools)"
    groups:
      tools-minor-and-patch:
        update-types:
          - minor
          - patch

  # Workflow actions are pinned to commit SHAs, which Dependabot rewrites while
  # keeping the human-readable version comment in step.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci(actions)"
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  # The release tooling's lockfile, which pins semantic-release by hash. Without
  # this it would silently fall behind and never pick up a security fix.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - tooling
    commit-message:
      prefix: "ci(release-tooling)"
    groups:
      release-tooling:
        update-types:
          - minor
          - patch
    ignore:
      # conventional-changelog-conventionalcommits 10 requires
      # conventional-changelog-writer >=9. semantic-release 25 depends on
      # @semantic-release/release-notes-generator ^14.1.0, which depends on
      # writer ^8.0.0. So preset 10 runs ahead of the whole stable
      # semantic-release line and cannot be used with it: merging that bump
      # breaks release-notes generation in the job that publishes.
      #
      # It happened once already (#62, fixed in #63). Without this, Dependabot
      # re-proposes the same bump every week and it only takes one merge.
      #
      # Remove this when @semantic-release/release-notes-generator 15 is
      # released as stable — it depends on writer ^9 and preset ^10 — and
      # semantic-release depends on it.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types:
          - version-update:semver-major
