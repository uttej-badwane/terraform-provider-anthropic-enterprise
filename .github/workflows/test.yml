# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
# Every push and pull request runs the full suite. README changes used to be
# skipped, but the required status checks on main mean a skipped workflow never
# reports and the pull request waits forever, so nothing is path-filtered.
on:
  pull_request:
  push:
    branches:
      - main

# A newer push to the same branch or pull request supersedes the running suite.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

# Every checkout below passes `persist-credentials: false`. By default
# actions/checkout writes its token into .git/config on the runner, where
# any later step can read it — and these jobs run `go build`, `go test`
# and `make generate`, which execute third-party module code. No job here
# pushes, so none of them needs the credential to remain on disk.

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      # A dependency added without `go mod tidy` leaves go.sum incomplete,
      # which breaks a clean build for everyone else and for the release job.
      - name: Check go.mod tidiness
        run: make tidy-check
      - run: go build -v .
      # Unit tests for the client and the mock. The acceptance matrix below only
      # runs ./internal/provider, so without this step they never ran in CI.
      - name: Unit tests
        run: go test -count=1 ./...
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned like everything else: `latest` made lint results depend on
          # the day the job ran. Bump together with `make tools`.
          version: v2.13.2

  # .goreleaser.yml is only exercised when a tag is pushed, so a mistake in it
  # used to surface after the tag existed — at which point the tag has to be
  # deleted and recut. `goreleaser check` validates the config on the pull
  # request instead. It parses and validates only; it builds nothing and needs
  # no credentials.
  goreleaser:
    name: GoReleaser config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          install-only: true
      - name: Check the release config
        run: goreleaser check

  # Dependabot reports dependencies whose version is known to be vulnerable.
  # govulncheck goes further and reports only the vulnerabilities this code can
  # actually reach, so the two together catch both the upgrade and the exposure.
  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # govulncheck tracks the current Go release and needs a newer toolchain
      # than the module's floor, which go-version-file would pin it to. The
      # scan is unaffected by building with a newer Go than the module targets.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true
      - name: Run govulncheck
        # Pinned; Dependabot does not see a go run @version, so bump it here
        # and in the GNUmakefile together.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Lints the workflow files themselves. Run through `go run` rather than an
  # action so there is no extra SHA to pin and keep current.
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true
      # Pinned rather than @latest, for the same reason as golangci-lint above:
      # `latest` made the result depend on the day the job ran.
      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

      # Fork pull requests run here without a maintainer approving each one,
      # which is only safe because every workflow triggers on `pull_request`
      # and so gets a read-only token and no secrets. `pull_request_target`
      # runs with the base repository's secrets while checking out the fork's
      # code, and nothing stopped one being added.
      #
      # Matched at key position only — as a trigger, as a list item under
      # `on:`, or anywhere on an `on:` line — so the comments that name the
      # trigger in prose, including this one, do not trip it.
      - name: Reject pull_request_target
        run: |
          set -euo pipefail
          if hits=$(grep -rnE \
                '^[[:space:]]*(-[[:space:]]*)?pull_request_target[[:space:]]*:?[[:space:]]*$|^[[:space:]]*on:.*pull_request_target' \
                .github/workflows/); then
            echo "::error::pull_request_target grants the base repository's secrets to a workflow that checks out fork code. Use pull_request."
            echo "${hits}"
            exit 1
          fi
          echo "No pull_request_target trigger found."

  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      # We need the latest version of Terraform for our documentation generation to use
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: make generate
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'make generate' command and commit."; exit 1)

  # Run acceptance tests in a matrix with Terraform CLI versions
  test:
    name: 'Acceptance Tests: Terraform ${{ matrix.terraform }}'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Terraform versions
        terraform:
          - '1.13.*'
          - '1.14.*'
          - '1.15.*'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      - env:
          TF_ACC: "1"
        run: go test -v -cover ./internal/provider/
        timeout-minutes: 10

  # The README states the provider works with OpenTofu, so CI has to show it.
  # The suite drives whichever binary TF_ACC_TERRAFORM_PATH names, and resolves
  # the provider from the host named by TF_ACC_PROVIDER_HOST, which has to be
  # OpenTofu's registry rather than Terraform's.
  test-opentofu:
    name: 'Acceptance Tests: OpenTofu ${{ matrix.opentofu }}'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        opentofu:
          # 1.11 is the floor: write-only attributes, which the vault credential
          # and deployment resources rely on, are rejected before it.
          - '1.11.*'
          - '1.12.*'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.opentofu }}
          tofu_wrapper: false
      - run: go mod download
      - env:
          TF_ACC: "1"
          TF_ACC_PROVIDER_HOST: registry.opentofu.org
        run: |
          TF_ACC_TERRAFORM_PATH="$(which tofu)" go test -v -cover ./internal/provider/
        timeout-minutes: 10
