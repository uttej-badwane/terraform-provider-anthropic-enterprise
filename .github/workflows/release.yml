# Terraform Provider release workflow.
name: Release

# This GitHub action creates a release when a tag that matches the pattern
# "v*" (e.g. v0.1.0) is created.
on:
  push:
    tags:
      - 'v*'

# The default token can only read. The one job that publishes asks for what it
# needs below, so a second job added later starts from read-only.
permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The signing key lives in this environment so a protection rule (required
    # reviewers) can gate every release, and a tag push alone cannot sign one.
    environment: release
    permissions:
      # Creating the release and uploading assets counts as writing contents.
      contents: write
      # Build provenance is signed with the workflow's OIDC identity.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
          # Do not leave the write token in .git/config for later steps.
          persist-credentials: false
      # Build releases with the current patched Go. go-version-file pins
      # setup-go to the exact version in the go directive and sets
      # GOTOOLCHAIN=local, which shipped v0.1.0 on go1.25.8 and with it the
      # standard library vulnerabilities fixed in 1.25.9 and later. The go
      # directive now tracks the latest stable release and is bumped when Go
      # ships one, so the two normally agree; `stable` here is the backstop
      # for the gap between a Go release and that bump.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true
      - name: Install syft for SBOM generation
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
      # SLSA provenance for every archive and the checksum file, so a consumer
      # can verify which workflow at which commit built what they downloaded:
      #   gh attestation verify <file> --repo uttej-badwane/terraform-provider-anthropic-enterprise
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*_SHA256SUMS
