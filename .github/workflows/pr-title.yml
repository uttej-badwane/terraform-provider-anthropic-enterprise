# Pull requests are squash-merged, so the pull request title becomes the commit
# subject on main, and that subject is what semantic-release reads to decide
# whether to cut a release and what the version is. A title that is not a
# Conventional Commit silently produces no release.
#
# Checked in shell rather than through an action, so there is no extra SHA to
# keep current for twenty lines of regex.
name: PR title

# pull_request, not pull_request_target: the check reads only the title, which
# the event payload carries, so it never needs the base repository's secrets.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the title
        env:
          # Read through the environment rather than interpolated into the
          # script, so a title containing shell metacharacters is data.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          echo "Title: ${TITLE}"

          types='feat|fix|perf|revert|build|deps|docs|test|refactor|style|chore|ci'
          if printf '%s' "$TITLE" | grep -qE "^(${types})(\([a-z0-9._/-]+\))?!?: .+"; then
            echo "Looks like a Conventional Commit."
          else
            cat >&2 <<MSG
          ::error::The pull request title is not a Conventional Commit.

          It becomes the commit subject when this is squash-merged, and that
          subject decides whether a release is cut and what the version is.

          Use:   <type>(<optional scope>): <description>
          For example:
            feat(federation): add an ephemeral token resource
            fix(external_key): stop a rename from replacing the registration
            docs: explain the credential classes

          Types: ${types}

          feat gives a minor release, fix and perf a patch, and a "!" after the
          type (or a "BREAKING CHANGE:" footer) gives a major. docs, test,
          refactor, style, chore and ci are recorded in the notes but do not
          release on their own.
          MSG
            exit 1
          fi
