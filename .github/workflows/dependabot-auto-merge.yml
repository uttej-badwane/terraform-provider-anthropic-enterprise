# Merges Dependabot's routine updates without a human, so that staying current
# is the default rather than a chore that gets deferred.
#
# The safety here is not in this workflow — it is in branch protection. `gh pr
# merge --auto` only queues the merge; GitHub holds it until every required
# check passes, and drops it if one fails. So an update that breaks the build,
# the acceptance suite across five runtimes, the vulnerability scan or the
# release configuration is never merged, whoever asked for it.
#
# Deliberately NOT pull_request_target. That trigger runs with the base
# repository's secrets against the pull request's code, which for an
# auto-merging workflow would be an unusually direct path from a dependency
# update to a credential. `pull_request` gets a read-only token by default;
# the permissions below grant only what queuing a merge needs.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Dependabot's own pull requests only. Nothing else reaches this job.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      # Queuing the merge writes to the pull request and, on success, to main.
      contents: write
      pull-requests: write
    steps:
      - name: Read the update metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Majors stop here for a person to read. A major is where a dependency
      # changes behaviour rather than fixing it, and this repository has
      # already had one such bump break the release pipeline after its checks
      # went green, because nothing exercised the path it broke.
      - name: Queue the merge
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Explain why a major was left alone
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body \
            "Left for review: this is a major update (\`${UPDATE_TYPE}\`), and auto-merge covers patch and minor only. Majors change behaviour rather than fixing it, so this one needs a person."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
